server:
  port: 8080
  # За обратным прокси (nginx и т.п.) включите, чтобы видеть реальный IP клиента:
  # forward-headers-strategy: framework

spring:
  application:
    name: skillorbit
  datasource:
    url: jdbc:h2:file:./data/skillorbit;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  web:
    resources:
      # Фронтенд отдаётся прямо из ../frontend (запуск из папки backend)
      static-locations: file:../frontend/, classpath:/static/
  jackson:
    default-property-inclusion: non_null

skillorbit:
  cors:
    # В продакшене замените на свой домен, например https://skillorbit.app
    allowed-origins:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
  rate-limit:
    requests-per-minute: 10
  p2p:
    max-peers-per-room: 6

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.skillorbit: INFO
